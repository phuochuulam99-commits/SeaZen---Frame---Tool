<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEAZEN 2026 — Gắn khung ảnh</title>
<style>
  :root{--ink:#11161c;--ink-2:#1b232c;--line:#2b3642;--steel:#8d9aa8;--paper:#eef1f5;--gold:#f2b21a;--gold-soft:#f7d271}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI",Roboto,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:320px 1fr;grid-template-rows:auto 1fr auto;min-height:100vh}
  header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--ink);color:#fff;border-bottom:2px solid var(--gold)}
  .mark{width:30px;height:30px;border-radius:7px;flex:none;background:linear-gradient(140deg,var(--gold),#b57d00);display:grid;place-items:center;color:var(--ink);font-weight:800;font-size:14px}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.4px}
  header p{margin:0;font-size:12.5px;color:var(--steel)}
  header .yr{margin-left:auto;font-size:13px;color:var(--gold-soft);font-weight:700}
  aside{background:var(--ink-2);color:#dde3ea;padding:18px;overflow:auto;border-right:1px solid var(--line)}
  .grp{margin-bottom:22px}
  .grp>h2{font-size:12px;font-weight:700;margin:0 0 9px;color:var(--gold);letter-spacing:.3px}
  .ratios{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ratio{background:#141b23;border:1px solid var(--line);border-radius:9px;padding:9px 4px 8px;cursor:pointer;color:#c8d2dc;font:inherit;display:grid;justify-items:center;gap:6px;transition:border-color .15s,background .15s}
  .ratio:hover{border-color:#48576a}
  .ratio.on{background:#2a2113;border-color:var(--gold);color:var(--gold)}
  .ratio span{font-size:11.5px;font-weight:600}
  .drop{border:1.5px dashed #48576a;border-radius:11px;background:#141b23;padding:20px 14px;text-align:center;cursor:pointer;transition:.15s}
  .drop:hover,.drop.hot{border-color:var(--gold);background:#1e1a10}
  .drop b{display:block;font-size:13.5px;color:#eaeff5}
  .drop small{color:var(--steel);font-size:11.5px}
  label.f{display:flex;justify-content:space-between;font-size:12px;color:#a9b6c3;margin:0 0 6px}
  input[type=range]{width:100%;accent-color:var(--gold)}
  input[type=text]{width:100%;background:#141b23;border:1px solid var(--line);border-radius:8px;color:#eef2f7;padding:9px 10px;font:inherit;font-size:13px;margin-bottom:9px}
  input:focus-visible,button:focus-visible,.drop:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .row{display:flex;gap:8px;align-items:center}
  .chk{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#c8d2dc;margin-bottom:10px;cursor:pointer}
  .chk input{accent-color:var(--gold);width:15px;height:15px}
  button{font:inherit;border-radius:9px;border:1px solid var(--line);background:#141b23;color:#d7dfe8;padding:10px 12px;cursor:pointer;font-size:13px}
  button:hover:not(:disabled){border-color:#5b6b7e}
  button:disabled{opacity:.4;cursor:not-allowed}
  .primary{background:var(--gold);border-color:var(--gold);color:#171205;font-weight:700;width:100%;padding:12px}
  .primary:hover:not(:disabled){background:var(--gold-soft)}
  .ghost{flex:1}
  main{padding:20px;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#fff,#e3e8ee)}
  .stage{max-width:100%;box-shadow:0 14px 40px rgba(17,22,28,.22);border-radius:3px;overflow:hidden;line-height:0}
  canvas{display:block;max-width:100%;max-height:calc(100vh - 240px);cursor:grab}
  canvas.grab{cursor:grabbing}
  .hint{grid-column:1/-1;text-align:center;font-size:12px;color:#6b7885;margin-top:10px}
  footer{grid-column:1/-1;background:#fff;border-top:1px solid #d6dce3;padding:10px 16px;display:flex;gap:9px;align-items:center;overflow-x:auto;min-height:64px}
  footer .empty{font-size:12.5px;color:#8a95a1}
  .thumb{position:relative;flex:none}
  .thumb img{height:44px;width:60px;object-fit:cover;border-radius:6px;border:2px solid #d6dce3;cursor:pointer;display:block}
  .thumb.on img{border-color:var(--gold)}
  .thumb button{position:absolute;top:-6px;right:-6px;width:19px;height:19px;padding:0;border-radius:50%;background:var(--ink);color:#fff;border:none;font-size:12px;line-height:19px;text-align:center}
  @media (max-width:820px){.app{grid-template-columns:1fr}aside{border-right:none;border-bottom:1px solid var(--line)}canvas{max-height:50vh}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">SZ</div>
    <div><h1>SEAZEN — Gắn khung ảnh</h1><p>Chuẩn hóa vận hành · Vững chắc từng ca trực</p></div>
    <div class="yr">2026</div>
  </header>

  <aside>
    <div class="grp">
      <h2>Tỷ lệ khung</h2>
      <div class="ratios" id="ratios"></div>
    </div>

    <div class="grp">
      <h2>Ảnh</h2>
      <div class="drop" id="drop" tabindex="0" role="button">
        <b>Chọn hoặc kéo thả ảnh</b>
        <small>Chọn nhiều ảnh cùng lúc đều được</small>
      </div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>

    <div class="grp">
      <h2>Căn chỉnh</h2>
      <label class="f" for="zoom"><span>Phóng to</span><span id="zoomv">100%</span></label>
      <input type="range" id="zoom" min="100" max="320" value="100" disabled>
      <div class="row" style="margin-top:10px">
        <button class="ghost" id="reset" disabled>Căn giữa lại</button>
      </div>
    </div>

    <div class="grp">
      <h2>Ảnh nền</h2>
      <label class="f" for="mode"><span>Màu chữ logo &amp; chủ đề</span></label>
      <select id="mode" style="width:100%;background:#141b23;border:1px solid var(--line);border-radius:8px;color:#eef2f7;padding:9px 10px;font:inherit;font-size:13px;margin-bottom:12px">
        <option value="auto">Tự động theo nền ảnh</option>
        <option value="dark">Chữ navy (nền sáng)</option>
        <option value="light">Chữ trắng (nền tối)</option>
      </select>
      <label class="f" for="dim"><span>Làm tối ảnh</span><span id="dimv">0%</span></label>
      <input type="range" id="dim" min="0" max="60" value="0">
    </div>

    <div class="grp">
      <h2>Chữ trên ảnh</h2>
      <label class="chk"><input type="checkbox" id="useCap"> Hiện tiêu đề</label>
      <input type="text" id="cap" placeholder="Tiêu đề" disabled>
      <input type="text" id="sub" placeholder="Thông tin phụ" disabled>
    </div>

    <div class="grp">
      <label class="f" for="setName"><span>Tên bộ ảnh</span></label>
      <input type="text" id="setName" placeholder="VD: Le ra quan Vinhomes">
      <button class="primary" id="dl" disabled>Tải ảnh xuống</button>
      <label class="chk" style="margin:12px 0 8px"><input type="checkbox" id="allRatios"> Xuất cả 3 tỷ lệ cho mỗi ảnh</label>
      <button class="ghost" id="dlAll" style="width:100%" disabled>Tải tất cả về 1 file .zip</button>
      <p id="prog" style="font-size:12px;color:#8d9aa8;margin:8px 0 0;min-height:16px"></p>
    </div>
  </aside>

  <main>
    <div class="stage"><canvas id="cv"></canvas></div>
    <p class="hint">Kéo ảnh để dịch chuyển · lăn chuột để phóng to</p>
  </main>

  <footer id="queue"><span class="empty">Hàng chờ trống — thêm ảnh để bắt đầu.</span></footer>
</div>

const art = {};

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let key = 'rect', items = [], cur = -1;
const frameImgs = {};

for (const n in ASSETS){
  const im = new Image();
  im.onload = () => { art[n] = im; draw(); };
  im.src = ASSETS[n];
}

const ratiosEl = document.getElementById('ratios');
for (const k in FRAMES){
  const f = FRAMES[k];
  const b = document.createElement('button');
  b.className = 'ratio' + (k===key?' on':''); b.dataset.k = k;
  const ar = f.w/f.h, bw = ar>=1?32:32*ar, bh = ar>=1?32/ar:32;
  b.innerHTML = `<i style="width:${bw}px;height:${bh}px;display:block;border:1.5px solid currentColor;border-radius:2px;opacity:.85"></i><span>${f.label}</span>`;
  b.onclick = () => { key=k; [...ratiosEl.children].forEach(c=>c.classList.toggle('on',c.dataset.k===k)); syncZoom(); draw(); };
  ratiosEl.appendChild(b);
}

const fileEl = document.getElementById('file'), drop = document.getElementById('drop');
drop.onclick = () => fileEl.click();
drop.onkeydown = e => { if(e.key==='Enter'||e.key===' '){e.preventDefault();fileEl.click();} };
fileEl.onchange = e => addFiles(e.target.files);
['dragover','dragenter'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('hot');}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('hot');}));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); if(e.target!==drop) addFiles(e.dataTransfer.files); });

function addFiles(list){
  [...list].filter(f=>f.type.startsWith('image/')).forEach(f=>{
    const rd = new FileReader();
    rd.onload = () => {
      const im = new Image();
      im.onload = () => {
        items.push({img:im, name:f.name.replace(/\.[^.]+$/,''), url:rd.result, t:{}});
        cur = items.length-1; renderQueue(); syncZoom(); enable(true); draw();
      };
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  });
}

function enable(on){
  ['zoom','reset','dl','dlAll'].forEach(id=>document.getElementById(id).disabled = !on);
  const c = document.getElementById('useCap').checked;
  document.getElementById('cap').disabled = !(on&&c);
  document.getElementById('sub').disabled = !(on&&c);
}

function tr(){
  const it = items[cur]; if(!it) return null;
  if(!it.t[key]) it.t[key] = {z:1,ox:0,oy:0};
  return it.t[key];
}

function renderQueue(){
  const q = document.getElementById('queue'); q.innerHTML='';
  if(!items.length){ q.innerHTML='<span class="empty">Hàng chờ trống — thêm ảnh để bắt đầu.</span>'; return; }
  items.forEach((it,i)=>{
    const d = document.createElement('div');
    d.className = 'thumb'+(i===cur?' on':'');
    const img = document.createElement('img'); img.src=it.url; img.alt=it.name;
    img.onclick = () => { cur=i; renderQueue(); syncZoom(); draw(); };
    const x = document.createElement('button'); x.textContent='×'; x.title='Bỏ ảnh';
    x.onclick = () => { items.splice(i,1); cur=Math.min(cur,items.length-1); renderQueue(); enable(items.length>0); draw(); };
    d.append(img,x); q.appendChild(d);
  });
}

const zoomEl = document.getElementById('zoom');
function syncZoom(){
  const t = tr();
  zoomEl.value = t ? Math.round(t.z*100) : 100;
  document.getElementById('zoomv').textContent = zoomEl.value+'%';
}
zoomEl.oninput = () => { const t=tr(); if(!t) return; t.z=zoomEl.value/100; document.getElementById('zoomv').textContent=zoomEl.value+'%'; clamp(); draw(); };
document.getElementById('reset').onclick = () => { const t=tr(); if(!t) return; t.z=1;t.ox=0;t.oy=0; syncZoom(); draw(); };

const dimEl = document.getElementById('dim');
document.getElementById('mode').onchange = draw;
dimEl.oninput = () => { document.getElementById('dimv').textContent = dimEl.value+'%'; draw(); };

document.getElementById('useCap').onchange = e => {
  document.getElementById('cap').disabled = !e.target.checked || !items.length;
  document.getElementById('sub').disabled = !e.target.checked || !items.length;
  draw();
};
document.getElementById('cap').oninput = draw;
document.getElementById('sub').oninput = draw;

let drag = null;
cv.addEventListener('pointerdown', e => {
  if(!items[cur]) return;
  cv.setPointerCapture(e.pointerId); cv.classList.add('grab');
  drag = {x:e.clientX,y:e.clientY,t:tr(),ox:tr().ox,oy:tr().oy};
});
cv.addEventListener('pointermove', e => {
  if(!drag) return;
  const k = cv.width / cv.getBoundingClientRect().width;
  drag.t.ox = drag.ox + (e.clientX-drag.x)*k;
  drag.t.oy = drag.oy + (e.clientY-drag.y)*k;
  clamp(); draw();
});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{drag=null;cv.classList.remove('grab');}));
cv.addEventListener('wheel', e => {
  const t = tr(); if(!t) return;
  e.preventDefault();
  t.z = Math.min(3.2, Math.max(1, t.z*(e.deltaY<0?1.06:0.94)));
  syncZoom(); clamp(); draw();
}, {passive:false});

function clamp(){
  const t = tr(); if(!t) return;
  const f = FRAMES[key], im = items[cur].img;
  const s = Math.max(f.w/im.width, f.h/im.height)*t.z;
  const mx = Math.max(0,(im.width*s-f.w)/2), my = Math.max(0,(im.height*s-f.h)/2);
  t.ox = Math.max(-mx, Math.min(mx, t.ox));
  t.oy = Math.max(-my, Math.min(my, t.oy));
}

function lum(c, x, y, w, h){
  x=Math.max(0,x|0); y=Math.max(0,y|0);
  w=Math.min(c.canvas.width-x,w|0); h=Math.min(c.canvas.height-y,h|0);
  if(w<=0||h<=0) return 255;
  const d = c.getImageData(x,y,w,h).data;
  let s=0, n=0;
  for(let i=0;i<d.length;i+=16){ s += 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; n++; }
  return s/n;
}

function render(c, k, it, t){
  const f = FRAMES[k], M = LAY.M, MB = LAY.MB;
  c.canvas.width = f.w; c.canvas.height = f.h;
  c.fillStyle = '#fff'; c.fillRect(0,0,f.w,f.h);

  if(it){
    const im = it.img;
    const s = Math.max(f.w/im.width, f.h/im.height)*t.z;
    const dw = im.width*s, dh = im.height*s;
    c.drawImage(im, (f.w-dw)/2+t.ox, (f.h-dh)/2+t.oy, dw, dh);
    const dim = +document.getElementById('dim').value/100;
    if(dim>0){ c.fillStyle = `rgba(12,16,22,${dim})`; c.fillRect(0,0,f.w,f.h); }
  }

  if(!art.logoN || !art.themeN || !art.bar) return;

  const mode = document.getElementById('mode').value;
  const lg = art.logoN, th = art.themeN;
  const lx = M, ly = M, lw = lg.width, lh = lg.height;
  const tx = f.w-M-th.width, ty = ly+lh/2-th.height/2;

  const pick = (x,y,w,h) => mode==='light' ? true
                          : mode==='dark'  ? false
                          : (it ? lum(c,x,y,w,h) < 145 : false);

  c.drawImage(pick(lx,ly,lw,lh) && art.logoL ? art.logoL : lg, lx, ly, lw, lh);
  c.drawImage(pick(tx,ty,th.width,th.height) && art.themeL ? art.themeL : th,
              tx, ty, th.width, th.height);
  c.drawImage(art.bar, (f.w-art.bar.width)/2, f.h-MB-art.bar.height);

  const cap = document.getElementById('cap').value.trim();
  const sub = document.getElementById('sub').value.trim();
  if(it && document.getElementById('useCap').checked && (cap||sub)){
    const pad = f.w*0.055;
    const base = f.h - MB - art.bar.height - f.h*0.03;
    const g = c.createLinearGradient(0, base-f.h*0.22, 0, base+f.h*0.02);
    g.addColorStop(0,'rgba(10,14,19,0)'); g.addColorStop(1,'rgba(10,14,19,.78)');
    c.fillStyle = g; c.fillRect(0, base-f.h*0.22, f.w, f.h*0.24);
    let y = base;
    if(sub){
      c.font = `500 ${Math.round(f.w*0.026)}px "Segoe UI",Roboto,system-ui,sans-serif`;
      c.fillStyle = '#d3dae2'; c.fillText(sub, pad, y);
      y -= f.w*0.042;
    }
    if(cap){
      const fs = Math.round(f.w*0.045);
      c.font = `700 ${fs}px "Segoe UI",Roboto,system-ui,sans-serif`;
      c.fillStyle = '#fff'; c.fillText(cap, pad, y);
      y -= fs*0.55;
      c.fillStyle = '#e9aa2d'; c.fillRect(pad, y, f.w*0.075, Math.max(3,f.w*0.006));
    }
  }
}

function draw(){ render(ctx, key, items[cur], items[cur]?tr():null); }

function save(c, name){
  c.canvas.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }, 'image/png');
}
document.getElementById('dl').onclick = () => {
  if(!items[cur]) return;
  save(ctx, fileName(key, items[cur], cur));
};
const CRCT = (() => {
  const t = new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[i]=c>>>0; }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zip(files){
  const enc = new TextEncoder(), local = [], central = [];
  let off = 0;
  for(const f of files){
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,sz,true); lh.setUint32(22,sz,true);
    lh.setUint16(26,nm.length,true);
    local.push(new Uint8Array(lh.buffer), nm, f.data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0,0x02014b50,true); cd.setUint16(4,20,true); cd.setUint16(6,20,true);
    cd.setUint16(8,0x0800,true);
    cd.setUint32(16,crc,true); cd.setUint32(20,sz,true); cd.setUint32(24,sz,true);
    cd.setUint16(28,nm.length,true); cd.setUint32(42,off,true);
    central.push(new Uint8Array(cd.buffer), nm);
    off += 30 + nm.length + sz;
  }
  const cdSize = central.reduce((s,c)=>s+c.length,0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);
  eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
  eo.setUint32(12,cdSize,true); eo.setUint32(16,off,true);
  return new Blob([...local, ...central, new Uint8Array(eo.buffer)], {type:'application/zip'});
}
const deacc = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/đ/g,'d').replace(/Đ/g,'D');
const slugify = s => deacc(s||'').replace(/[^A-Za-z0-9]+/g,'-')
  .replace(/^-+|-+$/g,'').slice(0,40);
function today(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
}
function fileName(k, it, idx){
  const set = slugify(document.getElementById('setName').value) || slugify(it.name) || 'Anh';
  const n = String(idx+1).padStart(2,'0');
  return `SEAZEN2026_${today()}_${set}_${FRAMES[k].slug}_${n}.png`;
}
const prog = document.getElementById('prog');
document.getElementById('dlAll').onclick = async () => {
  if(!items.length) return;
  const btn = document.getElementById('dlAll');
  btn.disabled = true;
  const keys = document.getElementById('allRatios').checked ? Object.keys(FRAMES) : [key];
  const off = document.createElement('canvas').getContext('2d');
  const files = [], total = items.length * keys.length;
  let n = 0;
  try{
    for(const it of items){
      for(const k of keys){
        if(!it.t[k]) it.t[k] = {z:1,ox:0,oy:0};
        render(off, k, it, it.t[k]);
        const blob = await new Promise(r => off.canvas.toBlob(r, 'image/png'));
        files.push({ name: fileName(k, it, items.indexOf(it)),
                     data: new Uint8Array(await blob.arrayBuffer()) });
        prog.textContent = `Đang dựng ${++n}/${total} ảnh…`;
        await new Promise(r => setTimeout(r, 0));
      }
    }
    prog.textContent = 'Đang đóng gói .zip…';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zip(files));
    const setn = slugify(document.getElementById('setName').value) || 'BoAnh';
    a.download = `SEAZEN2026_${today()}_${setn}_${total}anh.zip`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 8000);
    prog.textContent = `Đã tải ${total} ảnh.`;
  } catch(e){
    prog.textContent = 'Lỗi khi xuất: ' + e.message;
  } finally { btn.disabled = false; }
};

draw();
</script>
